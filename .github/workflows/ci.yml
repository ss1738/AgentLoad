name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/agentload-hardening]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,demo]'
      - run: python -m compileall -q agentload examples tests
      - run: AGENTLOAD_REQUIRE_E2E=1 pytest -q -rs -s tests/test_end_to_end.py
      - run: AGENTLOAD_REQUIRE_E2E=1 pytest -q -rs
      - run: agentload --help && agentload run --help && agentload analyze --help
